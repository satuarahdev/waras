version: '3.8'

services:
  api:
    build: .
    container_name: waras
    ports:
      - "127.0.0.1:${HOST_PORT:-25335}:3000"
    environment:
      - TZ=Asia/Jakarta
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: web-gateway
    external: true
